version: 1

# Shared defaults for small course trees used as slide markers.
defaults:
  tree: mc
  asset_base_url: ../classlib/classlib/quarto/components/trees
  width: 16%
  font_scale: 3.9
  classes:
    - course-tree-marker

# Add a named entry here as each teaching context is designed.
markers:
  sampling:
    font_scale: 2.6
    labels:
      - pseudorandom-numbers
      - low-discrepancy

  random-generation:
    labels:
      - random-generation

  low-discrepancy:
    font_scale: 3.3
    labels:
      - low-discrepancy
      - discrepancy

  low-discrepancy-sampling:
    font_scale: 3.3
    labels: [low-discrepancy]

  quant-finance:
    labels:
      - qf

  practice:
    font_scale: 3.2
    group_headings:
      - practice

  probability:
    labels:
      - probability

  statistics:
    labels:
      - statistics

  probstat:
    font_scale: 3.3
    labels:
      - probability
      - statistics

  error-assessment:
    font_scale: 3.0
    labels: [error-assessment]

  estimation:
    labels:
      - estimation

  stat-estim:
    labels:
      - statistics
      - estimation

  prob-est:
    labels:
      - probability
      - estimation

  prob-stat-est:
    font_scale: 3.0
    labels:
      - probability
      - statistics
      - estimation

  # Deck 03 contexts: selections of existing MC-tree labels only.
  mcmc:
    font_scale: 3.2
    labels: [mcmc]

  mcmc-probability:
    font_scale: 3.0
    labels: [mcmc, probability]

  mcmc-practice:
    font_scale: 3.0
    labels: [mcmc]
    group_headings: [practice]

  mcmc-statistics:
    font_scale: 3.0
    labels: [mcmc, statistics]

  discrepancy:
    font_scale: 3.0
    labels: [discrepancy]

  discrepancy-statistics:
    font_scale: 3.0
    labels: [discrepancy, statistics]

  discrepancy-analysis:
    font_scale: 3.0
    labels: [discrepancy, analysis]

  discrepancy-probability:
    font_scale: 3.0
    labels: [discrepancy, probability]

  inference-estimation:
    font_scale: 2.8
    labels: [statistical-inference, estimation]

  bayesian-mcmc:
    font_scale: 2.8
    labels: [bayesian-computation, mcmc, statistics]

  probability-practice:
    font_scale: 3.2
    labels: [probability]
    group_headings: [practice]

  mcmc-discrepancy-practice:
    font_scale: 2.7
    labels: [mcmc, discrepancy]
    group_headings: [practice]

  # Course Map summaries: existing labels for the content of each whole deck.
  deck-02-overview:
    width: 42%
    font_scale: 1.15
    classes: [deck-summary-tree]
    labels: [probability, analysis, linear-algebra, random-generation, pseudorandom-numbers, low-discrepancy, qf]

  deck-03-overview:
    width: 42%
    font_scale: 1.15
    classes: [deck-summary-tree]
    labels: [probability, statistics, analysis, mcmc, discrepancy, low-discrepancy, estimation, error-assessment, statistical-inference, bayesian-computation]
    group_headings: [practice]

  deck-04-overview:
    width: 42%
    font_scale: 1.15
    classes: [deck-summary-tree]
    labels: [probability, statistics, analysis, linear-algebra, random-generation, low-discrepancy, discrepancy, estimation, error-assessment, variance-reduction, importance-sampling, density-estimation, qf]

  deck-05-overview:
    width: 42%
    font_scale: 1.15
    classes: [deck-summary-tree]
    labels: [probability, statistics, analysis, cs, estimation, error-assessment, variance-reduction, multilevel, stochastic-optimization, hpc]
