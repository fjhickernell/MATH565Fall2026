version: 1

# Shared defaults for small course trees used as slide markers.
defaults:
  tree: mc
  asset_base_url: ../classlib/classlib/quarto/components/trees
  width: 16%
  font_scale: 3.9
  classes:
    - course-tree-marker

# Add a named entry here as each teaching context is designed.
markers:
  probability:
    labels:
      - probability

  statistics:
    labels:
      - statistics

  probstat:
    font_scale: 3.3
    labels:
      - probability
      - statistics

  estimation:
    labels:
      - estimation

  stat-estim:
    labels:
      - statistics
      - estimation

  prob-est:
    labels:
      - probability
      - estimation
