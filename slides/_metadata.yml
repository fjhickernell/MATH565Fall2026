metadata-files:
  - ../classlib/classlib/quarto/slides/hickernell-slides.yml
  - ../classlib/classlib/quarto/metadata/hickernell-texts.yml
  - ../classlib/classlib/quarto/metadata/hickernell-papers.yml

course_title: "MATH 565 — Fall 2026"
author: "Fred J. Hickernell"
date: today
date-format: "MMMM D, YYYY"
jupyter: qmcpy

reveal-options:
  disableLayout: false

course_website: https://fjhickernell.github.io/MATH565Fall2026/

decks:
  d01:
    file: 01-introduction.html
    title: Introduction
    short_title: Introduction

  d02:
    file: 02-generating-samples.html
    title: Generating Samples
    short_title: Generating Samples

  d03:
    file: 03-markov-chain-monte-carlo.html
    title: Markov Chain Monte Carlo
    short_title: MCMC

  d04:
    file: 04-improving-efficiency.html
    title: Improving Efficiency
    short_title: Improving Efficiency

  d05:
    file: 05-selected-topics.html
    title: Selected Topics
    short_title: Selected Topics

format:
  revealjs:
    navigation-mode: grid
    controls: true
    theme:
      - simple
      - ../classlib/classlib/quarto/slides/hickernell-slides.scss
      - math565-slides.scss
    html-math-method:
      method: mathjax
      url: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg-full.js

execute:
  warning: false
  message: false
  freeze: false
  fig-path: "{basename}_files/figure-revealjs/"

filters:
  - tree-marker.lua
