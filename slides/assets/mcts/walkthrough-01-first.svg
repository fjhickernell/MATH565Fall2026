<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" role="img" aria-labelledby="title desc">
<title id="title">First simulation: expand A, roll out and back up one</title>
<desc id="desc">First simulation: expand A, roll out and back up one. Stored labels give successes W / visits N. root: 1/1; A: 1/1. Solid edges belong to the stored tree; dashed edges are sampled continuations only. A&#x27;s stored descendants are collapsed when shown.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5a91"/></marker>
<marker id="gold" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9a6509"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#216b56"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac3543"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#61717a"/></marker>
</defs>
<g font-family="Arial, sans-serif" text-anchor="middle">
<path d="M298.6 108.0 L211.4 162.0" fill="none" stroke="#1f5a91" stroke-width="4" marker-end="url(#blue)"/>
<path d="M150.0 238.0 L150.0 292.0" fill="none" stroke="#61717a" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#gray)"/>
<path d="M150.0 368.0 L150.0 422.0" fill="none" stroke="#61717a" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#gray)"/>
<path d="M150.0 498.0 L150.0 552.0" fill="none" stroke="#61717a" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#gray)"/>
<rect x="265" y="32" width="190" height="76" rx="12" fill="white" stroke="#1f5a91" stroke-width="3"/>
<text x="360" y="65" font-size="29" fill="#1f5a91">Start</text>
<text x="360" y="95" font-size="25" fill="#1f5a91">1 / 1</text>
<rect x="55" y="162" width="190" height="76" rx="12" fill="white" stroke="#1f5a91" stroke-width="3"/>
<text x="150" y="195" font-size="29" fill="#1f5a91">A</text>
<text x="150" y="225" font-size="25" fill="#1f5a91">1 / 1</text>
<rect x="55" y="292" width="190" height="76" rx="12" fill="#f8fafb" stroke="#61717a" stroke-width="2" stroke-dasharray="9 7"/>
<text x="150" y="325" font-size="27" fill="#61717a">A–0</text>
<text x="150" y="355" font-size="23" fill="#61717a">sampled only</text>
<rect x="55" y="422" width="190" height="76" rx="12" fill="#f8fafb" stroke="#61717a" stroke-width="2" stroke-dasharray="9 7"/>
<text x="150" y="455" font-size="27" fill="#61717a">A–0–1</text>
<text x="150" y="485" font-size="23" fill="#61717a">sampled only</text>
<rect x="55" y="552" width="190" height="76" rx="12" fill="#f8fafb" stroke="#61717a" stroke-width="2" stroke-dasharray="9 7"/>
<text x="150" y="585" font-size="27" fill="#61717a">A–0–1–0</text>
<text x="150" y="615" font-size="23" fill="#61717a">sampled only</text>
<text x="540" y="515" font-size="28" fill="#216b56">T = 76 min</text>
<text x="540" y="554" font-size="28" fill="#216b56">On time: R = 1</text>
<text x="400" y="660" font-size="25" fill="#1f5a91">W / N = successes / visits</text>
