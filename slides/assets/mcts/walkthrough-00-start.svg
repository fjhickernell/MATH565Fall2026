<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
<title id="title">Start with only the root stored</title>
<desc id="desc">Start with only the root stored. Stored labels give successes W / visits N. root: 0/0. Solid edges belong to the stored tree; dashed edges are sampled continuations only, discarded after the rollout. Every stored node in both A and B is shown. Green marks the one newly stored node.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5a91"/></marker>
<marker id="gold" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9a6509"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#216b56"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac3543"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#61717a"/></marker>
</defs>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="430" y="32" width="140" height="76" rx="12" fill="white" stroke="#1f5a91" stroke-width="3"/>
<text x="500" y="65" font-size="27" fill="#1f5a91">Start</text>
<text x="500" y="95" font-size="24" fill="#1f5a91">0 / 0</text>
<text x="500" y="650" font-size="24" fill="#1f5a91">W / N = successes / visits · before → after backup</text>
<text x="500" y="682" font-size="23" fill="#61717a">Solid: keep · Dashed: discard · Green: new node · Gold: select / update</text>
</g>
</svg>
