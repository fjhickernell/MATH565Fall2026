<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" role="img" aria-labelledby="title desc">
<title id="title">Simulation seven: back up one through B zero, B and Start</title>
<desc id="desc">Simulation seven: back up one through B zero, B and Start. Stored labels give successes W / visits N. root: 4/7; A: 3/5; B: 1/2; B0: 1/1. Solid edges belong to the stored tree; dashed edges are sampled continuations only. A&#x27;s stored descendants are collapsed when shown.</desc>
