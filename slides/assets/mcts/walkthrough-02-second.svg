<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
<title id="title">Second simulation: expand B, roll out and back up zero</title>
<desc id="desc">Second simulation: expand B, roll out and back up zero. Stored labels give successes W / visits N. root: 1/2; A: 1/1; B: 0/1. Solid edges belong to the stored tree; dashed edges are sampled continuations only, discarded after the rollout. Every stored node in both A and B is shown. Green marks the one newly stored node.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5a91"/></marker>
<marker id="gold" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9a6509"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#216b56"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac3543"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#61717a"/></marker>
</defs>
<g font-family="Arial, sans-serif" text-anchor="middle">
<path d="M434.2 108.0 L340.8 162.0" fill="none" stroke="#1f5a91" stroke-width="4" marker-end="url(#blue)"/>
<path d="M680.0 163.6 L570.0 106.4" fill="none" stroke="#9a6509" stroke-width="4" marker-end="url(#gold)"/>
<path d="M786.5 238.0 L838.5 292.0" fill="none" stroke="#61717a" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#gray)"/>
<path d="M875.0 368.0 L875.0 422.0" fill="none" stroke="#61717a" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#gray)"/>
<path d="M875.0 498.0 L875.0 552.0" fill="none" stroke="#61717a" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#gray)"/>
<rect x="430" y="32" width="140" height="76" rx="12" fill="#fff7e7" stroke="#9a6509" stroke-width="3"/>
<text x="500" y="65" font-size="27" fill="#9a6509">Start</text>
<text x="500" y="95" font-size="24" fill="#9a6509">1/1→1/2</text>
<rect x="205" y="162" width="140" height="76" rx="12" fill="white" stroke="#1f5a91" stroke-width="3"/>
<text x="275" y="195" font-size="27" fill="#1f5a91">A</text>
<text x="275" y="225" font-size="24" fill="#1f5a91">1 / 1</text>
<rect x="680" y="162" width="140" height="76" rx="12" fill="#edf8f2" stroke="#216b56" stroke-width="3"/>
<text x="750" y="195" font-size="27" fill="#216b56">B</text>
<text x="750" y="225" font-size="24" fill="#216b56">0/0→0/1</text>
<rect x="805" y="292" width="140" height="76" rx="12" fill="#f8fafb" stroke="#61717a" stroke-width="2" stroke-dasharray="9 7"/>
<text x="875" y="325" font-size="25" fill="#61717a">B–1</text>
<text x="875" y="355" font-size="20" fill="#61717a">sampled only</text>
<rect x="805" y="422" width="140" height="76" rx="12" fill="#f8fafb" stroke="#61717a" stroke-width="2" stroke-dasharray="9 7"/>
<text x="875" y="455" font-size="25" fill="#61717a">B–1–0</text>
<text x="875" y="485" font-size="20" fill="#61717a">sampled only</text>
<rect x="805" y="552" width="140" height="76" rx="12" fill="#f8fafb" stroke="#61717a" stroke-width="2" stroke-dasharray="9 7"/>
<text x="875" y="585" font-size="25" fill="#61717a">B–1–0–0</text>
<text x="875" y="615" font-size="20" fill="#61717a">sampled only</text>
<text x="190" y="55" font-size="27" fill="#ac3543">T = 86 min</text>
<text x="190" y="90" font-size="27" fill="#ac3543">Late: R = 0</text>
<text x="500" y="650" font-size="24" fill="#1f5a91">W / N = successes / visits · before → after backup</text>
<text x="500" y="682" font-size="23" fill="#61717a">Solid: keep · Dashed: discard · Green: new node · Gold: select / update</text>
</g>
</svg>
