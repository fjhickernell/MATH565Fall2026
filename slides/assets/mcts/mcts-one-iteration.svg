<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">One successful Monte Carlo tree search iteration</title><desc id="desc">Select C at the root and its stored child C–1, expand the untried C–1–0 choice, randomly complete three further segment choices, then simulate traffic. On-time arrival returns one; back up that return along the stored path. Before this simulation C has three successes in five visits, C–0 one in three and C–1 one in one; the initial C rollout accounts for the remaining success and visit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, sans-serif" text-anchor="middle">
<path d="M395 84 L150 136" fill="none" stroke="#a8b4bc" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M395 84 L395 136" fill="none" stroke="#a8b4bc" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M395 84 L640 136" fill="none" stroke="#a76e12" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M640 214 L550 257" fill="none" stroke="#a8b4bc" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M640 214 L800 257" fill="none" stroke="#a76e12" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M800 323 L800 362" fill="none" stroke="#277465" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M800 428 L800 455" fill="none" stroke="#277465" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<path d="M960 475 C1080 400 1040 25 530 45" fill="none" stroke="#a76e12" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="272.5" y="6.0" width="245" height="78" rx="15" fill="white" stroke="#1f5a91" stroke-width="3"/><text x="395" y="42" font-size="30" fill="#1f5a91">Root</text><text x="395" y="72" font-size="24" fill="#1f5a91">60 simulations</text>
<rect x="40.0" y="136.0" width="220" height="78" rx="15" fill="white" stroke="#1f5a91" stroke-width="3"/><text x="150" y="172" font-size="30" fill="#1f5a91">A · North</text><text x="150" y="202" font-size="24" fill="#1f5a91">28 / 40</text>
<rect x="285.0" y="136.0" width="220" height="78" rx="15" fill="white" stroke="#1f5a91" stroke-width="3"/><text x="395" y="172" font-size="30" fill="#1f5a91">B · Central</text><text x="395" y="202" font-size="24" fill="#1f5a91">9 / 15</text>
<rect x="530.0" y="136.0" width="220" height="78" rx="15" fill="white" stroke="#a76e12" stroke-width="3"/><text x="640" y="172" font-size="30" fill="#a76e12">C · South</text><text x="640" y="202" font-size="24" fill="#a76e12">3 / 5</text>
<rect x="460.0" y="257.0" width="180" height="66" rx="15" fill="white" stroke="#61717a" stroke-width="3"/><text x="550" y="287" font-size="30" fill="#61717a">C–0</text><text x="550" y="317" font-size="24" fill="#61717a">stored: 1 / 3</text>
<rect x="710.0" y="257.0" width="180" height="66" rx="15" fill="white" stroke="#a76e12" stroke-width="3"/><text x="800" y="287" font-size="30" fill="#a76e12">C–1</text><text x="800" y="317" font-size="24" fill="#a76e12">stored: 1 / 1</text>
<rect x="710.0" y="362.0" width="180" height="66" rx="15" fill="white" stroke="#277465" stroke-width="3"/><text x="800" y="392" font-size="30" fill="#277465">C–1–0</text><text x="800" y="422" font-size="24" fill="#277465">new node</text>
<rect x="662.0" y="457.0" width="276" height="60" rx="15" fill="white" stroke="#277465" stroke-width="3"/><text x="800" y="497" font-size="30" fill="#277465">On time: R = 1</text>
<text x="670" y="108" font-size="27" fill="#a76e12">1  Select</text>
<text x="1000" y="365" font-size="26" fill="#277465">2  Expand</text>
<text x="555" y="446" font-size="25" fill="#277465">3  Rollout + traffic</text>
<text x="935" y="135" font-size="27" fill="#a76e12">4  Backup</text>
<text x="947" y="166" font-size="24" fill="#a76e12">the same R</text>
<text x="220" y="335" font-size="25" fill="#61717a">Node labels: successes / visits</text>
<text x="220" y="374" font-size="25" fill="#61717a">Solid: stored search tree</text>
<text x="220" y="413" font-size="25" fill="#277465">Dotted: sampled continuation</text>
</g>
</svg>
