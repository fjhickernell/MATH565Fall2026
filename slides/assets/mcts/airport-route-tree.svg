<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">A tree of airport route plans</title><desc id="desc">The root is an unplanned itinerary. Three first-leg actions North, Central and South create prefixes A, B and C. Each prefix branches to connector 0 or 1. Four further binary choices are omitted. Traffic is simulated only after the complete itinerary is chosen.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, sans-serif" text-anchor="middle">
<path d="M550 100 L190 177" fill="none" stroke="#61717a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M550 100 L550 177" fill="none" stroke="#61717a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M550 100 L910 177" fill="none" stroke="#61717a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M190 255 L100 335" fill="none" stroke="#61717a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M100 398 L100 450" fill="none" stroke="#61717a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<path d="M190 255 L280 335" fill="none" stroke="#61717a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M280 398 L280 450" fill="none" stroke="#61717a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<path d="M550 255 L460 335" fill="none" stroke="#61717a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M460 398 L460 450" fill="none" stroke="#61717a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<path d="M550 255 L640 335" fill="none" stroke="#61717a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M640 398 L640 450" fill="none" stroke="#61717a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<path d="M910 255 L820 335" fill="none" stroke="#61717a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M820 398 L820 450" fill="none" stroke="#61717a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<path d="M910 255 L1000 335" fill="none" stroke="#61717a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1000 398 L1000 450" fill="none" stroke="#61717a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<rect x="417.0" y="22.0" width="266" height="78" rx="15" fill="white" stroke="#1f5a91" stroke-width="3"/><text x="550" y="71" font-size="30" fill="#1f5a91">Plan an itinerary</text>
<rect x="65.0" y="177.0" width="250" height="78" rx="15" fill="white" stroke="#1f5a91" stroke-width="3"/><text x="190" y="213" font-size="30" fill="#1f5a91">A · North</text><text x="190" y="243" font-size="24" fill="#1f5a91">first leg planned</text>
<rect x="425.0" y="177.0" width="250" height="78" rx="15" fill="white" stroke="#1f5a91" stroke-width="3"/><text x="550" y="213" font-size="30" fill="#1f5a91">B · Central</text><text x="550" y="243" font-size="24" fill="#1f5a91">first leg planned</text>
<rect x="785.0" y="177.0" width="250" height="78" rx="15" fill="white" stroke="#1f5a91" stroke-width="3"/><text x="910" y="213" font-size="30" fill="#1f5a91">C · South</text><text x="910" y="243" font-size="24" fill="#1f5a91">first leg planned</text>
